<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可愛數字排序小遊戲</title>
    <style>
        :root {
            --primary-color: #ff7675;
            --secondary-color: #74b9ff;
            --success-color: #2ecc71;
            --error-color: #e74c3c;
            --bg-color: #f7f1e3;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100vh;
            overflow: hidden;
        }

        /* 頂部狀態列 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 10px 20px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 0 #d1ccc0;
            font-size: 28px;
            font-weight: bold;
            color: #4b4b4b;
        }

        .timer-box {
            color: #ff9f43;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 題目區（上方） */
        .game-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
            position: relative;
        }

        .numbers-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            width: 100%;
            max-width: 1000px;
            min-height: 200px;
        }

        /* 數字氣泡樣式與動畫 */
        .number-bubble {
            width: 90px;
            height: 90px;
            background: #ffeaa7;
            border: 6px solid #fdcb6e;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 42px;
            font-weight: bold;
            color: #2d3436;
            box-shadow: 0 10px 0 #e1b12c;
            position: relative;
            transform: scale(0);
            transition: background-color 0.3s, border-color 0.3s, box-shadow 0.3s;
        }

        /* 動態效果樣式 */
        @keyframes bounceIn {
            0% { transform: scale(0.3) translateY(100px); opacity: 0; }
            50% { transform: scale(1.1) translateY(-20px); opacity: 0.8; }
            70% { transform: scale(0.9) translateY(10px); opacity: 0.9; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        @keyframes twistIn {
            0% { transform: scale(0) rotate(-180deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        @keyframes popupIn {
            0% { transform: scale(0) translateY(50px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        .effect-bounce { animation: bounceIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .effect-twist { animation: twistIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .effect-popup { animation: popupIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.1) forwards; }

        /* 回饋特效層 */
        .feedback-overlay {
            position: absolute;
            font-size: 150px;
            font-weight: bold;
            z-index: 10;
            pointer-events: none;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .feedback-overlay.show {
            opacity: 1;
            transform: scale(1);
        }

        .feedback-correct { color: var(--success-color); text-shadow: 0 10px 0 #27ae60; }
        .feedback-wrong { color: var(--error-color); text-shadow: 0 10px 0 #c0392b; }

        /* 按鈕區（下方） */
        .controls-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            width: 100%;
            padding: 20px 0;
        }

        .btn {
            width: 280px;
            padding: 15px;
            font-size: 36px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn-ascending {
            background-color: #ff7675;
            box-shadow: 0 12px 0 #d63031;
        }

        .btn-ascending:active {
            transform: translateY(8px);
            box-shadow: 0 4px 0 #d63031;
        }

        .btn-descending {
            background-color: #74b9ff;
            box-shadow: 0 12px 0 #0984e3;
        }

        .btn-descending:active {
            transform: translateY(8px);
            box-shadow: 0 4px 0 #0984e3;
        }

        .btn-hint {
            font-size: 22px;
            opacity: 0.9;
            font-weight: normal;
            background: rgba(0,0,0,0.1);
            padding: 2px 15px;
            border-radius: 10px;
            margin-top: 5px;
        }
        
        /* 錯誤提示文字 */
        .wrong-hint {
            position: absolute;
            bottom: -40px;
            font-size: 24px;
            color: var(--error-color);
            font-weight: bold;
            background: white;
            padding: 5px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 0 #ccc;
            display: none;
            animation: shake 0.5s ease;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
    </style>
</head>
<body>

    <!-- 頂部狀態列 -->
    <div class="header">
        <div id="question-number">第 1 題</div>
        <div class="timer-box">⏰ 解題時間: <span id="timer-count">0.0</span> 秒</div>
        <div id="score-display">得分: 0</div>
    </div>

    <!-- 題目區 -->
    <div class="game-container">
        <div class="numbers-container" id="numbers-box"></div>
        <div class="feedback-overlay" id="feedback-layer">⭕</div>
        <div class="wrong-hint" id="error-hint-text">答錯囉！請再試一次，找出正確的排序方向！</div>
    </div>

    <!-- 下方按鈕控制區 -->
    <div class="controls-container">
        <button class="btn btn-ascending" onclick="checkAnswer('asc')">
            順數
            <span class="btn-hint">小 -> 大</span>
        </button>
        <button class="btn btn-descending" onclick="checkAnswer('desc')">
            倒數
            <span class="btn-hint">大 -> 小</span>
        </button>
    </div>

    <script>
        let currentQuestion = 1;
        let score = 0;
        let correctAnswer = ''; // 'asc' 或 'desc'
        let timerInterval = null;
        let startTime = null;
        let isCorrectState = false; // 是否已答對，答對時鎖定防止連續觸發

        // 生成新題目
        function generateQuestion() {
            isCorrectState = false;
            document.getElementById('question-number').innerText = `第 ${currentQuestion} 題`;
            document.getElementById('error-hint-text').style.display = 'none';
            
            // 隨機決定是順數還是倒數
            correctAnswer = Math.random() > 0.5 ? 'asc' : 'desc';
            
            // 決定範圍。最大20，需要連續7個數字，最大起始值為 20 - 7 + 1 = 14
            const maxStart = 14; 
            const startNum = Math.floor(Math.random() * maxStart) + 1; // 1 ~ 14
            
            // 建立連續不跳號的陣列 (7個數字，差值為1)
            let baseArray = [];
            for (let i = 0; i < 7; i++) {
                baseArray.push(startNum + i);
            }
            
            // 如果是倒數，將陣列反轉
            if (correctAnswer === 'desc') {
                baseArray.reverse();
            }
            
            // 渲染至畫面上並加入隨機特效
            const container = document.getElementById('numbers-box');
            container.innerHTML = '';
            
            // 隨機選取一種過場動畫
            const effects = ['effect-bounce', 'effect-twist', 'effect-popup'];
            const chosenEffect = effects[Math.floor(Math.random() * effects.length)];
            
            baseArray.forEach((num, index) => {
                const bubble = document.createElement('div');
                bubble.className = `number-bubble ${chosenEffect}`;
                bubble.innerText = num;
                // 設定錯開的動畫時間，呈現音律動態感
                bubble.style.animationDelay = `${index * 0.08}s`;
                container.appendChild(bubble);
            });

            // 重新啟動計時器 (每題獨立計時)
            resetAndStartTimer();
        }

        // 計時器功能
        function resetAndStartTimer() {
            clearInterval(timerInterval);
            startTime = performance.now();
            timerInterval = setInterval(() => {
                const elapsed = (performance.now() - startTime) / 1000;
                document.getElementById('timer-count').innerText = elapsed.toFixed(1);
            }, 100);
        }

        // 檢查答案
        function checkAnswer(playerChoice) {
            if (isCorrectState) return; // 如果已經答對正在過場，不重複執行

            const feedback = document.getElementById('feedback-layer');
            const errorHint = document.getElementById('error-hint-text');

            if (playerChoice === correctAnswer) {
                // 答對了
                isCorrectState = true;
                clearInterval(timerInterval); // 停止計時
                
                score += 10;
                document.getElementById('score-display').innerText = `得分: ${score}`;
                
                feedback.innerText = '⭕';
                feedback.className = 'feedback-overlay feedback-correct show';
                
                // 一秒後自動進下一題
                setTimeout(() => {
                    feedback.className = 'feedback-overlay';
                    currentQuestion++;
                    generateQuestion();
                }, 1200);
            } else {
                // 答錯了：允許改正，不跳題，顯示提示文字並觸發震動效果
                feedback.innerText = '❌';
                feedback.className = 'feedback-overlay feedback-wrong show';
                errorHint.style.display = 'block';
                
                // 震動一下提示文字
                errorHint.style.animation = 'none';
                setTimeout(() => {
                    errorHint.style.animation = 'shake 0.5s ease';
                }, 10);

                // 錯的標示短暫閃爍後消失，讓學生可以直接按另一個修正
                setTimeout(() => {
                    feedback.className = 'feedback-overlay';
                }, 800);
            }
        }

        // 初始化遊戲
        window.onload = function() {
            generateQuestion();
        }
    </script>
</body>
</html>
