    <!-- Audio Synth & Interaction Logic -->
    <script>
        // State tracking for each card animation
        const state = {
            'long-short': false,
            'tall-short': false,
            'wide-narrow': false,
            'thick-thin': false
        };

        let speechLang = 'zh-HK'; // Default Cantonese speech

        function toggleSpeechLang() {
            const btn = document.getElementById('langBtn');
            if (speechLang === 'zh-HK') {
                speechLang = 'zh-TW';
                btn.innerHTML = '🗣️ 語音: 普通話';
            } else {
                speechLang = 'zh-HK';
                btn.innerHTML = '🗣️ 語音: 廣東話';
            }
        }

        // Text-to-speech function
        function speak(text) {
            if ('speechSynthesis' in window) {
                // Cancel previous speaking
                window.speechSynthesis.cancel();
                
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = speechLang;
                utterance.rate = 0.85; // Slightly slower for primary teaching
                utterance.pitch = 1.1;

                // Play simple pop sound fallback using Web Audio API
                playTone(440, 0.08);

                window.speechSynthesis.speak(utterance);
            }
        }

        // Simple audio chime generator
        function playTone(freq, duration) {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch(e) {
                // Ignore audio errors
            }
        }

        // Toggle animation on specific card click
        function toggleCard(type) {
            state[type] = !state[type];
            applyAnimation(type, state[type]);

            // Pronounce words on card click
            if (type === 'long-short') speak(state[type] ? '長，短' : '長短');
            if (type === 'tall-short') speak(state[type] ? '高，矮' : '高矮');
            if (type === 'wide-narrow') speak(state[type] ? '闊，窄' : '闊窄');
            if (type === 'thick-thin') speak(state[type] ? '厚，薄' : '厚薄');
        }

        // Apply transformations based on active state
        function applyAnimation(type, isActive) {
            if (type === 'long-short') {
                const pencilLong = document.getElementById('pencil-long');
                const arrowLong = document.getElementById('arrow-long');
                const pencilShort = document.getElementById('pencil-short');
                const arrowShort = document.getElementById('arrow-short');

                if (isActive) {
                    // Long stretches longer, short shrinks smaller
                    pencilLong.style.transform = 'scaleX(1.35)';
                    arrowLong.style.transform = 'scaleX(1.35)';
                    pencilShort.style.transform = 'scaleX(0.65)';
                    arrowShort.style.transform = 'scaleX(0.65)';
                } else {
                    pencilLong.style.transform = 'scaleX(1)';
                    arrowLong.style.transform = 'scaleX(1)';
                    pencilShort.style.transform = 'scaleX(1)';
                    arrowShort.style.transform = 'scaleX(1)';
                }
            }

            if (type === 'tall-short') {
                const treeTall = document.getElementById('tree-tall');
                const arrowTall = document.getElementById('arrow-tall');
                const treeShort = document.getElementById('tree-short');
                const arrowTreeShort = document.getElementById('arrow-tree-short');

                if (isActive) {
                    // Tall grows taller, short shrinks lower
                    treeTall.style.transform = 'scaleY(1.3)';
                    arrowTall.style.transform = 'scaleY(1.3)';
                    treeShort.style.transform = 'scaleY(0.7)';
                    arrowTreeShort.style.transform = 'scaleY(0.7)';
                } else {
                    treeTall.style.transform = 'scaleY(1)';
                    arrowTall.style.transform = 'scaleY(1)';
                    treeShort.style.transform = 'scaleY(1)';
                    arrowTreeShort.style.transform = 'scaleY(1)';
                }
            }

            if (type === 'wide-narrow') {
                const doorWide = document.getElementById('door-wide');
                const arrowWide = document.getElementById('arrow-wide');
                const doorNarrow = document.getElementById('door-narrow');
                const arrowNarrow = document.getElementById('arrow-narrow');

                if (isActive) {
                    // Wide stretches wider horizontally, narrow becomes even narrower
                    doorWide.style.transform = 'scaleX(1.3)';
                    arrowWide.style.transform = 'scaleX(1.3)';
                    doorNarrow.style.transform = 'scaleX(0.6)';
                    arrowNarrow.style.transform = 'scaleX(0.6)';
                } else {
                    doorWide.style.transform = 'scaleX(1)';
                    arrowWide.style.transform = 'scaleX(1)';
                    doorNarrow.style.transform = 'scaleX(1)';
                    arrowNarrow.style.transform = 'scaleX(1)';
                }
            }

            if (type === 'thick-thin') {
                const bookThick = document.getElementById('book-thick');
                const arrowThick = document.getElementById('arrow-thick');
                const bookThin = document.getElementById('book-thin');
                const arrowThin = document.getElementById('arrow-thin');

                if (isActive) {
                    // Thick expands vertically, thin compresses thinner
                    bookThick.style.transform = 'scaleY(1.4)';
                    arrowThick.style.transform = 'scaleY(1.4)';
                    bookThin.style.transform = 'scaleY(0.5)';
                    arrowThin.style.transform = 'scaleY(0.5)';
                } else {
                    bookThick.style.transform = 'scaleY(1)';
                    arrowThick.style.transform = 'scaleY(1)';
                    bookThin.style.transform = 'scaleY(1)';
                    arrowThin.style.transform = 'scaleY(1)';
                }
            }
        }

        // Trigger all animations sequentially for classroom demonstration
        function triggerAllAnimations() {
            const keys = Object.keys(state);
            keys.forEach((key, idx) => {
                setTimeout(() => {
                    state[key] = true;
                    applyAnimation(key, true);
                    playTone(520 + idx * 100, 0.1);
                }, idx * 350);
            });
            speak("長短，高矮，闊窄，厚薄");
        }

        // Reset all animations to default initial state
        function resetAllAnimations() {
            Object.keys(state).forEach(key => {
                state[key] = false;
                applyAnimation(key, false);
            });
            playTone(300, 0.15);
        }
    </script>
</body>
</html>
