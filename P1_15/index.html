<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>認識100以內的數 - 小一數學互動樂園</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
  <style>
    /* 基礎鎖定：防止平板觸控誤放大、反白或捲動 */
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      touch-action: manipulation;
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
      background: linear-gradient(165deg, #f3e8ff 0%, #e0f2fe 52%, #fef9c3 100%);
    }

    /* 課本同款立體草綠色數粒 (3D Isometric Cube CSS) */
    .cube {
      position: relative;
      width: 22px;
      height: 22px;
      background-color: #a4d639; /* 正面亮草綠 */
      border: 1.5px solid #4d6e19;
      flex-shrink: 0;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* 頂面立體斜角 */
    .cube::before {
      content: '';
      position: absolute;
      top: -5px;
      left: 2px;
      width: 100%;
      height: 4.5px;
      background-color: #c2eb63;
      border-top: 1.5px solid #4d6e19;
      border-left: 1.5px solid #4d6e19;
      border-right: 1.5px solid #4d6e19;
      transform: skewX(-45deg);
      transform-origin: bottom left;
    }

    /* 右側面立體斜角 */
    .cube::after {
      content: '';
      position: absolute;
      top: -2.5px;
      right: -5px;
      width: 4.5px;
      height: 100%;
      background-color: #82b025;
      border-top: 1.5px solid #4d6e19;
      border-right: 1.5px solid #4d6e19;
      border-bottom: 1.5px solid #4d6e19;
      transform: skewY(-45deg);
      transform-origin: top left;
    }

    /* 響應式縮小積木以確保 10 條在平板上完整呈現不超出卡片 */
    @media (max-height: 760px) {
      .cube {
        width: 18px;
        height: 18px;
      }
      .cube::before { top: -4.5px; height: 4px; }
      .cube::after { right: -4.5px; width: 4px; }
    }

    @media (max-width: 768px) {
      .cube {
        width: 16px;
        height: 16px;
      }
      .cube::before { top: -4px; height: 3.5px; }
      .cube::after { right: -4px; width: 3.5px; }
    }

    /* 10粒一條：垂直緊密堆疊 */
    .ten-rod {
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      padding-top: 5px;
      padding-right: 5px;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .ten-rod .cube {
      margin-top: -1.5px; /* 讓上下邊框重合，形成整條質感 */
    }

    /* 散裝「粒」：每5粒一豎排，由下往上堆疊 */
    .ones-column {
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      gap: 3px;
      padding-top: 5px;
      padding-right: 5px;
    }

    /* 課本同款立體草綠色數粒 (3D Isometric Cube CSS) */
    .cube {
      position: relative;
      width: 24px;
      height: 24px;
      background-color: #a4d639; /* 正面亮草綠 */
      border: 1.5px solid #4d6e19;
      flex-shrink: 0;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* 頂面立體斜角 */
    .cube::before {
      content: '';
      position: absolute;
      top: -6px;
      left: 2px;
      width: 100%;
      height: 5px;
      background-color: #c2eb63;
      border-top: 1.5px solid #4d6e19;
      border-left: 1.5px solid #4d6e19;
      border-right: 1.5px solid #4d6e19;
      transform: skewX(-45deg);
      transform-origin: bottom left;
    }

    /* 右側面立體斜角 */
    .cube::after {
      content: '';
      position: absolute;
      top: -3px;
      right: -6px;
      width: 5px;
      height: 100%;
      background-color: #82b025;
      border-top: 1.5px solid #4d6e19;
      border-right: 1.5px solid #4d6e19;
      border-bottom: 1.5px solid #4d6e19;
      transform: skewY(-45deg);
      transform-origin: top left;
    }

    /* 響應式縮小積木以適應不同高度平板 */
    @media (max-height: 700px) {
      .cube {
        width: 19px;
        height: 19px;
      }
      .cube::before { top: -5px; height: 4px; }
      .cube::after { right: -5px; width: 4px; }
    }

    /* 10粒一條：垂直緊密堆疊 */
    .ten-rod {
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      padding-top: 6px;
      padding-right: 6px;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .ten-rod .cube {
      margin-top: -1.5px; /* 讓上下邊框重合，形成整條質感 */
    }

    /* 散裝「粒」：每5粒一豎排，由下往上堆疊 */
    .ones-column {
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      gap: 4px;
      padding-top: 6px;
      padding-right: 6px;
    }

    /* 動畫效果 */
    @keyframes popIn {
      0% { transform: scale(0.2) translateY(15px); opacity: 0; }
      75% { transform: scale(1.12) translateY(-2px); opacity: 1; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    .animate-pop-in {
      animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.7); }
      50% { transform: scale(1.04); box-shadow: 0 0 0 12px rgba(251, 191, 36, 0); }
    }

    .animate-action-prompt {
      animation: pulseGlow 1.5s infinite ease-in-out;
    }

    @keyframes shakeHighlight {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px) rotate(-1deg); }
      40% { transform: translateX(6px) rotate(1deg); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    .animate-shake {
      animation: shakeHighlight 0.45s ease-in-out;
    }

    /* 可點擊合併/拆開的高亮光暈 */
    .can-bundle-highlight {
      background: rgba(254, 240, 138, 0.55);
      border: 2.5px dashed #f59e0b;
      border-radius: 16px;
      padding: 6px 10px 4px 6px;
      cursor: pointer;
    }

    .can-split-highlight .ten-rod:last-child {
      filter: drop-shadow(0 0 8px rgba(244, 63, 94, 0.85));
      transform: scale(1.06);
    }

    /* 馬卡龍立體按鈕按壓感 */
    .macaron-btn {
      transition: all 0.12s ease;
      box-shadow: 0 5px 0 rgba(0, 0, 0, 0.14);
    }
    .macaron-btn:active:not(:disabled) {
      transform: translateY(4px);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.14);
    }
    .macaron-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
      transform: translateY(2px);
    }

    /* 遮罩模糊效果 (小眼睛功能) */
    .hidden-mask {
      position: relative;
      color: transparent !important;
      background: linear-gradient(135deg, #f1f5f9, #e2e8f0) !important;
      border-color: #cbd5e1 !important;
      user-select: none;
    }
    .hidden-mask::after {
      content: '❓✨ 猜猜看 ✨❓';
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.05em;
    }
    .hidden-mask * {
      opacity: 0 !important;
    }

    /* 語音朗讀時的聲波跳動回饋 */
    @keyframes soundWavePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.28); }
    }
    .speaking-wave {
      display: inline-block;
      animation: soundWavePulse 0.6s infinite ease-in-out;
    }
  </style>
</head>
<body class="flex flex-col justify-between">

  <!-- ==================== 上方三分之二：積木展示與教學區 (約 65vh) ==================== -->
  <section class="h-[65dvh] w-full flex flex-col px-3 pt-2 pb-1.5 sm:px-6 sm:pt-3 max-w-6xl mx-auto">
    
    <!-- 頂部老師/家長控制列：小眼睛遮罩 + 朗讀全部 + 音效開關 -->
    <header class="flex flex-wrap items-center justify-between gap-2 mb-2 bg-white/85 backdrop-blur-sm px-3 py-1.5 rounded-2xl shadow-sm border border-purple-100">
      <div class="flex items-center gap-2">
        <span class="text-xl sm:text-2xl">🧸</span>
        <h1 class="text-base sm:text-lg font-black text-purple-900 tracking-wide">認識100以內的數（0–100）</h1>
      </div>

      <!-- 小眼睛遮罩工具組 -->
      <div class="flex items-center gap-1.5 sm:gap-2 flex-wrap">
        <span class="text-xs font-bold text-purple-700 hidden md:inline">👁️ 遮罩出題：</span>
        
        <button id="toggle-num-btn" onclick="toggleMask('num')" class="flex items-center gap-1 px-2.5 py-1 rounded-xl text-xs sm:text-sm font-bold bg-sky-100 text-sky-800 border border-sky-200 hover:bg-sky-200 transition">
          <span id="eye-icon-num">👁️</span>
          <span>數字</span>
        </button>

        <button id="toggle-read-btn" onclick="toggleMask('read')" class="flex items-center gap-1 px-2.5 py-1 rounded-xl text-xs sm:text-sm font-bold bg-amber-100 text-amber-800 border border-amber-200 hover:bg-amber-200 transition">
          <span id="eye-icon-read">👁️</span>
          <span>讀作</span>
        </button>

        <button id="toggle-hint-btn" onclick="toggleMask('hint')" class="flex items-center gap-1 px-2.5 py-1 rounded-xl text-xs sm:text-sm font-bold bg-rose-100 text-rose-800 border border-rose-200 hover:bg-rose-200 transition">
          <span id="eye-icon-hint">👁️</span>
          <span>提示</span>
        </button>

        <div class="h-4 w-[1.5px] bg-purple-200 mx-0.5"></div>

        <!-- 朗讀全部按鈕 -->
        <button id="btn-speak-all" onclick="speakFullSentence()" class="flex items-center gap-1 px-3 py-1 rounded-xl text-xs sm:text-sm font-bold bg-emerald-400 text-white shadow-sm hover:bg-emerald-500 active:scale-95 transition">
          <span class="speaker-icon">🔊</span>
          <span>朗讀全部</span>
        </button>

        <!-- 音效開關 -->
        <button id="sound-toggle-btn" onclick="toggleSound()" class="p-1.5 rounded-xl bg-purple-100 text-purple-800 hover:bg-purple-200 transition" title="開關音效">
          🔔
        </button>
      </div>
    </header>

    <!-- 中央主要白色課本展示板 + 右側位值提示泡泡 -->
    <div class="flex-1 min-h-0 flex flex-col md:flex-row items-stretch justify-center gap-3 sm:gap-4 relative">
      
      <!-- 課本白色底板卡片 (仿課本圖示) -->
      <div class="flex-1 bg-white rounded-[28px] shadow-md border-2 border-purple-100 flex flex-col items-center justify-between p-2.5 sm:p-4 relative overflow-hidden">
        
        <!-- 頂部藍色膠囊數字標籤 -->
        <div class="flex items-center justify-center gap-3 z-10">
          <button id="number-badge" onclick="speakNumberOnly()" class="px-7 py-1 sm:px-9 sm:py-1.5 rounded-full bg-sky-200/90 hover:bg-sky-300 border-2 border-sky-300 text-slate-800 text-2xl sm:text-4xl font-black shadow-sm transition active:scale-95 flex items-center gap-2" title="點擊聽數字讀音">
            <span id="display-number">0</span>
            <span class="speaker-icon text-sm sm:text-base text-sky-700 opacity-80">🔊</span>
          </button>

          <!-- 動態操作狀態小標籤 -->
          <div id="action-badge" class="hidden px-3 py-1 rounded-full bg-orange-100 border border-orange-300 text-orange-700 text-xs sm:text-sm font-extrabold animate-bounce">
            ✨ 多 1 粒
          </div>
        </div>

        <!-- 中央積木擺放舞台 -->
        <div id="blocks-stage" class="flex-1 w-full flex items-end justify-center gap-3 sm:gap-6 py-1.5 px-2 overflow-hidden relative">
          <!-- 0 粒時的可愛柔和空狀態提示 -->
          <div id="zero-placeholder" class="hidden absolute inset-0 flex flex-col items-center justify-center text-center pointer-events-none px-4">
            <div class="px-5 py-3 rounded-3xl bg-purple-50/90 border-2 border-dashed border-purple-200 text-purple-700 flex flex-col items-center gap-1 shadow-2xs">
              <span class="text-2xl sm:text-3xl">🧺✨</span>
              <span class="text-sm sm:text-lg font-black">0 粒，現在一粒也沒有喔！</span>
              <span class="text-xs font-bold text-purple-500">按下方「➕ 多 1 粒」或「🔢 輸入數量」開始吧</span>
            </div>
          </div>

          <!-- 十位區（「條」） -->
          <div id="tens-container" class="flex items-end gap-1 sm:gap-2 min-h-[120px]">
            <!-- JS 動態生成「條」 -->
          </div>

          <!-- 個位區（「粒」：每5粒一豎排） -->
          <div id="ones-wrapper" onclick="handleOnesClick()" class="flex items-end gap-1 sm:gap-1.5 min-h-[120px] transition-all">
            <div id="ones-col-1" class="ones-column"></div>
            <div id="ones-col-2" class="ones-column"></div>
          </div>
        </div>

        <!-- 滿十合併 / 退一拆開 互動提示浮動大按鈕 -->
        <div id="special-action-banner" class="hidden z-20 my-1">
          <button id="special-action-btn" onclick="executeSpecialAction()" class="animate-action-prompt px-4 py-1.5 sm:px-6 sm:py-2 rounded-full bg-gradient-to-r from-amber-400 via-orange-400 to-rose-400 text-white font-black text-sm sm:text-base shadow-lg border-2 border-white flex items-center gap-1.5 active:scale-95 transition">
            <span id="special-action-icon">✨</span>
            <span id="special-action-text">滿 10 粒了！點我合成 1 條</span>
          </button>
        </div>

        <!-- 底部白色膠囊讀法標籤 (仿課本「0 讀作零」) -->
        <div class="z-10 mt-1">
          <button id="reading-badge" onclick="speakReadingOnly()" class="px-6 py-1 sm:px-8 sm:py-1.5 rounded-full bg-slate-50 hover:bg-purple-50 border-2 border-slate-200 text-slate-800 text-lg sm:text-2xl font-bold shadow-sm transition active:scale-95 flex items-center gap-2" title="點擊聽讀作發音">
            <span id="display-reading">0 讀作零</span>
            <span class="speaker-icon text-sm text-purple-600 opacity-80">🔊</span>
          </button>
        </div>
      </div>

      <!-- 右側（手機直屏時在下方）位值概念對話泡泡與可愛小學生插畫 -->
      <div class="md:w-72 lg:w-80 flex flex-col justify-center gap-2">
        <div id="hint-bubble" onclick="speakHintOnly()" class="cursor-pointer bg-amber-50 hover:bg-amber-100/80 border-[3px] border-amber-400 rounded-[28px] p-3 sm:p-4 shadow-md relative transition active:scale-98">
          <div class="flex items-center justify-between mb-1.5">
            <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full bg-rose-400 text-white text-xs font-bold">
              💬 數一數
            </span>
            <span class="text-amber-700 text-xs sm:text-sm font-bold flex items-center gap-1">
              <span class="speaker-icon">🔊</span> 點擊朗讀
            </span>
          </div>
          
          <p id="display-hint" class="text-slate-800 text-base sm:text-lg font-bold leading-relaxed">
            一粒也沒有，<br>
            即有 <span class="text-emerald-600 text-xl sm:text-2xl font-black">0</span> 個 10 和 <span class="text-orange-500 text-xl sm:text-2xl font-black">0</span> 個 1。
          </p>
        </div>

        <!-- 可愛小學生角色插畫 (大螢幕/平板橫屏顯示，仿課本右下角思考小學生) -->
        <div class="hidden md:flex items-center justify-end pr-2 gap-2">
          <div class="bg-white/80 px-3 py-1 rounded-2xl border border-emerald-200 text-xs font-bold text-emerald-800 shadow-2xs">
            一起來點數吧！🌟
          </div>
          <svg class="w-16 h-16 shrink-0 drop-shadow-sm" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="可愛小學生插畫">
            <!-- 頭髮 -->
            <path d="M22 48C20 28 34 15 50 15C66 15 80 28 78 48C78 52 74 54 72 50C68 35 60 30 50 30C40 30 32 35 28 50C26 54 22 52 22 48Z" fill="#5C3A21"/>
            <path d="M44 16C46 10 54 10 56 16" stroke="#5C3A21" stroke-width="4" stroke-linecap="round"/>
            <!-- 臉蛋 -->
            <circle cx="50" cy="52" r="24" fill="#FFE0BD"/>
            <!-- 腮紅 -->
            <ellipse cx="36" cy="57" rx="4.5" ry="2.5" fill="#FF9AA2" opacity="0.75"/>
            <ellipse cx="64" cy="57" rx="4.5" ry="2.5" fill="#FF9AA2" opacity="0.75"/>
            <!-- 眼睛 -->
            <circle cx="41" cy="50" r="3" fill="#332219"/>
            <circle cx="59" cy="50" r="3" fill="#332219"/>
            <circle cx="42" cy="49" r="1" fill="#FFFFFF"/>
            <circle cx="60" cy="49" r="1" fill="#FFFFFF"/>
            <!-- 微笑嘴巴 -->
            <path d="M45 60C47.5 63.5 52.5 63.5 55 60" stroke="#D9534F" stroke-width="2.5" stroke-linecap="round"/>
            <!-- 校服領子 -->
            <path d="M28 88C30 76 38 73 50 73C62 73 70 76 72 88H28Z" fill="#38BDF8"/>
            <path d="M40 73L50 82L60 73" fill="#FFFFFF"/>
          </svg>
        </div>
      </div>

    </div>
  </section>

  <!-- ==================== 下方三分之一：學生操作區 (約 35vh) ==================== -->
  <section class="h-[35dvh] w-full bg-gradient-to-b from-[#fffdf7] to-[#fef3c7] border-t-4 border-amber-200 rounded-t-[32px] shadow-[0_-6px_20px_rgba(0,0,0,0.05)] px-3 py-2.5 sm:px-6 sm:py-3.5 flex flex-col justify-center">
    <div class="max-w-5xl w-full mx-auto h-full grid grid-cols-12 gap-2.5 sm:gap-4 items-stretch">
      
      <!-- 1. 少 1 粒 按鈕 (馬卡龍蜜桃粉) -->
      <div class="col-span-4 flex">
        <button id="btn-minus" onclick="handleMinusOne()" class="macaron-btn w-full h-full rounded-3xl bg-gradient-to-b from-rose-200 to-rose-300 border-2 border-rose-400 text-rose-950 flex flex-col items-center justify-center gap-1 p-2">
          <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-white/85 flex items-center justify-center text-2xl sm:text-3xl font-black text-rose-600 shadow-inner">
            ➖
          </div>
          <span class="text-lg sm:text-2xl font-black tracking-wide">少 1 粒</span>
          <span class="text-[11px] sm:text-xs font-bold text-rose-900/80 hidden sm:inline">最小到 0 粒</span>
        </button>
      </div>

      <!-- 2. 多 1 粒 按鈕 (馬卡龍薄荷綠) -->
      <div class="col-span-4 flex">
        <button id="btn-plus" onclick="handlePlusOne()" class="macaron-btn w-full h-full rounded-3xl bg-gradient-to-b from-emerald-200 to-emerald-300 border-2 border-emerald-400 text-emerald-950 flex flex-col items-center justify-center gap-1 p-2">
          <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-white/85 flex items-center justify-center text-2xl sm:text-3xl font-black text-emerald-600 shadow-inner">
            ➕
          </div>
          <span class="text-lg sm:text-2xl font-black tracking-wide">多 1 粒</span>
          <span class="text-[11px] sm:text-xs font-bold text-emerald-900/80 hidden sm:inline">最大到 100 粒</span>
        </button>
      </div>

      <!-- 3. 右側功能區：輸入數量 (0-100) + 清空歸零 -->
      <div class="col-span-4 flex flex-col gap-2 sm:gap-2.5 justify-between">
        
        <!-- 輸入數量按鈕 (馬卡龍奶油黃) -->
        <button onclick="openKeypad()" class="macaron-btn flex-1 rounded-2xl sm:rounded-3xl bg-gradient-to-b from-amber-200 to-amber-300 border-2 border-amber-400 text-amber-950 flex flex-col items-center justify-center p-1.5 sm:p-2">
          <div class="flex items-center gap-1.5">
            <span class="text-xl sm:text-2xl">🔢</span>
            <span class="text-base sm:text-xl font-black">輸入數量</span>
          </div>
          <span class="text-[11px] sm:text-xs font-bold bg-white/80 px-2.5 py-0.5 rounded-full text-amber-900 mt-0.5">
            0–100 粒
          </span>
        </button>

        <!-- 清空歸零按鈕 (馬卡龍天空藍) -->
        <button onclick="handleReset()" class="macaron-btn h-11 sm:h-14 rounded-2xl bg-gradient-to-b from-sky-200 to-sky-300 border-2 border-sky-400 text-sky-950 flex items-center justify-center gap-1.5 font-black text-sm sm:text-lg">
          <span>🔄</span>
          <span>清空歸零</span>
        </button>

      </div>

    </div>
  </section>

  <!-- ==================== 彈出式可愛大數字鍵盤 (限定 0 至 100) ==================== -->
  <div id="keypad-modal" class="hidden fixed inset-0 z-50 bg-slate-900/45 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-[#fffdf9] border-4 border-amber-300 rounded-[32px] shadow-2xl w-full max-w-sm p-5 animate-pop-in">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-xl font-black text-amber-950 flex items-center gap-2">
          <span>🔢</span> 請輸入 0 至 100 的數
        </h2>
        <button onclick="closeKeypad()" class="w-9 h-9 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-black text-lg flex items-center justify-center">
          ✕
        </button>
      </div>

      <!-- 輸入顯示框 -->
      <div class="bg-amber-50 border-2 border-amber-300 rounded-2xl py-3 px-4 mb-2 text-center relative">
        <span id="keypad-display" class="text-4xl font-black text-amber-950 tracking-wider">_</span>
        <span class="text-sm font-bold text-amber-700 ml-1">粒</span>
      </div>
      <p id="keypad-error" class="text-center text-xs font-bold text-slate-500 h-4 mb-2">請輸入 0 至 100 之間的整數</p>

      <!-- 0-9 大按鍵網格 -->
      <div class="grid grid-cols-3 gap-2.5 mb-3">
        <button onclick="pressKey('1')" class="macaron-btn py-3 rounded-2xl bg-white border-2 border-slate-200 text-2xl font-black text-slate-800">1</button>
        <button onclick="pressKey('2')" class="macaron-btn py-3 rounded-2xl bg-white border-2 border-slate-200 text-2xl font-black text-slate-800">2</button>
        <button onclick="pressKey('3')" class="macaron-btn py-3 rounded-2xl bg-white border-2 border-slate-200 text-2xl font-black text-slate-800">3</button>
        <button onclick="pressKey('4')" class="macaron-btn py-3 rounded-2xl bg-white border-2 border-slate-200 text-2xl font-black text-slate-800">4</button>
        <button onclick="pressKey('5')" class="macaron-btn py-3 rounded-2xl bg-white border-2 border-slate-200 text-2xl font-black text-slate-800">5</button>
        <button onclick="pressKey('6')" class="macaron-btn py-3 rounded-2xl bg-white border-2 border-slate-200 text-2xl font-black text-slate-800">6</button>
        <button onclick="pressKey('7')" class="macaron-btn py-3 rounded-2xl bg-white border-2 border-slate-200 text-2xl font-black text-slate-800">7</button>
        <button onclick="pressKey('8')" class="macaron-btn py-3 rounded-2xl bg-white border-2 border-slate-200 text-2xl font-black text-slate-800">8</button>
        <button onclick="pressKey('9')" class="macaron-btn py-3 rounded-2xl bg-white border-2 border-slate-200 text-2xl font-black text-slate-800">9</button>
        
        <button onclick="clearKeypad()" class="macaron-btn py-3 rounded-2xl bg-rose-100 border-2 border-rose-300 text-lg font-black text-rose-800">清除</button>
        <button onclick="pressKey('0')" class="macaron-btn py-3 rounded-2xl bg-white border-2 border-slate-200 text-2xl font-black text-slate-800">0</button>
        <button onclick="confirmKeypad()" class="macaron-btn py-3 rounded-2xl bg-emerald-300 border-2 border-emerald-400 text-lg font-black text-emerald-950">確定 ✓</button>
      </div>
    </div>
  </div>

  <!-- 輕量提示吐司訊息 (取代 alert) -->
  <div id="toast-msg" class="pointer-events-none fixed top-16 left-1/2 -translate-x-1/2 z-50 opacity-0 transition-opacity duration-300 bg-slate-800/90 text-white px-5 py-2.5 rounded-full text-sm sm:text-base font-bold shadow-lg">
    提示訊息
  </div>

  <script>
    /**
     * ==================== 狀態管理 ====================
     * 支援網址參數 ?n=0~100，預設從 0 開始
     */
    function getInitialNumber() {
      try {
        const params = new URLSearchParams(window.location.search);
        const raw = params.get('n');
        if (raw !== null && raw.trim() !== '') {
          const n = parseInt(raw, 10);
          if (!isNaN(n) && n >= 0 && n <= 100) {
            return n;
          }
        }
      } catch (e) {}
      return 0;
    }

    const initialNum = getInitialNumber();

    const state = {
      tens: Math.floor(initialNum / 10),  // 目前畫面上的「條」數 (0 ~ 10)
      ones: initialNum % 10,              // 目前畫面上的散裝「粒」數 (0 ~ 10，允許暫存10粒等待學生點擊合併)
      pendingSplit: false,                // 是否處於整十按了「少 1 粒」，等待學生點擊「1 條拆成 10 粒並減 1 粒」
      lastActionText: '',                 // 最近一次操作標籤 ('✨ 多 1 粒' / '🔻 少 1 粒')
      masks: {
        num: false,
        read: false,
        hint: false
      },
      soundEnabled: true,
      keypadValue: ''
    };

    // 計算目前總數 (始終在 0 ~ 100)
    function getTotal() {
      return state.tens * 10 + state.ones;
    }

    /**
     * ==================== 數字轉香港繁體中文讀法 ====================
     */
    function numberToChinese(num) {
      const digits = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
      if (num === 0) return '零';
      if (num === 100) return '一百';
      if (num < 10) return digits[num];
      
      const t = Math.floor(num / 10);
      const o = num % 10;
      
      if (t === 1) {
        return o === 0 ? '十' : '十' + digits[o];
      }
      return digits[t] + '十' + (o === 0 ? '' : digits[o]);
    }

    /**
     * ==================== 音效系統 (Web Audio API 合成可愛音效) ====================
     */
    let audioCtx = null;
    function playTone(type) {
      if (!state.soundEnabled) return;
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'add') {
          // 輕快上升音
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now); // C5
          osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.12); // E5
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
          osc.start(now);
          osc.stop(now + 0.15);
        } else if (type === 'minus') {
          // 柔和下降音
          osc.type = 'sine';
          osc.frequency.setValueAtTime(493.88, now); // B4
          osc.frequency.exponentialRampToValueAtTime(392.00, now + 0.12); // G4
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
          osc.start(now);
          osc.stop(now + 0.15);
        } else if (type === 'bundle') {
          // 滿十合併成功叮咚和弦
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now); // C5
          osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
          osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
          osc.frequency.setValueAtTime(1046.50, now + 0.24); // C6
          gain.gain.setValueAtTime(0.22, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
          osc.start(now);
          osc.stop(now + 0.45);
        } else if (type === 'split') {
          // 拆開積木音效
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(783.99, now);
          osc.frequency.exponentialRampToValueAtTime(440, now + 0.22);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        } else if (type === 'warn') {
          // 提示注意音
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.setValueAtTime(440, now + 0.12);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
          osc.start(now);
          osc.stop(now + 0.22);
        }
      } catch (e) {
        // 忽略音訊限制錯誤
      }
    }

    function toggleSound() {
      state.soundEnabled = !state.soundEnabled;
      const btn = document.getElementById('sound-toggle-btn');
      btn.textContent = state.soundEnabled ? '🔔' : '🔕';
      showToast(state.soundEnabled ? '已開啟音效與粵語發音' : '已靜音');
      if (!state.soundEnabled && 'speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    }

    /**
     * ==================== 粵語語音朗讀系統 (Web Speech API) ====================
     */
    let cachedCantoneseVoice = null;

    function loadVoices() {
      if (!('speechSynthesis' in window)) return;
      const voices = window.speechSynthesis.getVoices();
      // 優先尋找香港粵語 (zh-HK / Cantonese)，若無則退回 zh-TW / zh-CN
      cachedCantoneseVoice =
        voices.find(v => v.lang === 'zh-HK' || v.lang === 'zh_HK') ||
        voices.find(v => v.name.includes('Cantonese') || v.name.includes('粵語') || v.name.includes('Sin-Ji') || v.name.includes('HiuGaai') || v.name.includes('HiuMaan')) ||
        voices.find(v => v.lang.startsWith('zh-TW')) ||
        voices.find(v => v.lang.startsWith('zh-CN')) ||
        voices.find(v => v.lang.startsWith('zh'));
    }

    if ('speechSynthesis' in window) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    function setSpeakerWave(active) {
      document.querySelectorAll('.speaker-icon').forEach(el => {
        el.classList.toggle('speaking-wave', active);
      });
    }

    function speakCantonese(text) {
      if (!state.soundEnabled) return;
      if (!('speechSynthesis' in window)) {
        showToast('此瀏覽器不支援語音朗讀');
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      if (cachedCantoneseVoice) {
        utterance.voice = cachedCantoneseVoice;
      }
      utterance.lang = 'zh-HK';
      utterance.rate = 0.88; // 適合小一學生的清晰語速
      utterance.pitch = 1.08;
      utterance.onstart = () => setSpeakerWave(true);
      utterance.onend = () => setSpeakerWave(false);
      utterance.onerror = () => setSpeakerWave(false);
      window.speechSynthesis.speak(utterance);
    }

    function speakNumberOnly() {
      if (state.masks.num) return;
      const total = getTotal();
      speakCantonese(numberToChinese(total));
    }

    function speakReadingOnly() {
      if (state.masks.read) return;
      const total = getTotal();
      const cn = numberToChinese(total);
      speakCantonese(`${cn}，讀作${cn}`);
    }

    function speakHintOnly() {
      if (state.masks.hint) return;
      const text = getPlainHintText();
      speakCantonese(text);
    }

    function speakFullSentence() {
      const total = getTotal();
      const cn = numberToChinese(total);
      const hintText = getPlainHintText();
      speakCantonese(`${cn}，讀作${cn}。${hintText}`);
    }

    /**
     * ==================== 核心教學互動邏輯 (限定 1 至 100) ====================
     */

    // 1. 「➕ 多 1 粒」按鈕邏輯
    function handlePlusOne() {
      if (state.ones === 10 || state.pendingSplit) {
        playTone('warn');
        triggerBannerShake();
        return;
      }

      const currentTotal = getTotal();
      if (currentTotal >= 100) {
        playTone('warn');
        showToast('已經是 100 啦！本單元認識 1 至 100 的數。');
        speakCantonese('已經是一百啦！');
        return;
      }

      // 增加 1 粒（若從 9 變 10，暫時保留為 10 粒並鎖定加減按鈕，讓學生自己點擊合併）
      state.ones += 1;
      state.lastActionText = '✨ 多 1 粒';
      playTone('add');
      render(true);

      if (state.ones === 10) {
        speakCantonese('滿十粒了！點我合成一條！');
      } else {
        speakCantonese(`多一粒，現在是${numberToChinese(getTotal())}`);
      }
    }

    // 2. 「➖ 少 1 粒」按鈕邏輯
    function handleMinusOne() {
      if (state.ones === 10 || state.pendingSplit) {
        playTone('warn');
        triggerBannerShake();
        return;
      }

      const currentTotal = getTotal();
      if (currentTotal <= 0) {
        playTone('warn');
        showToast('已經是 0 粒啦，不可以再減少囉！');
        speakCantonese('已經是零粒啦，不可以再減少！');
        return;
      }

      // 情況 A：目前有散粒 (ones >= 1)，直接拿走 1 粒
      if (state.ones > 0) {
        state.ones -= 1;
        state.lastActionText = '🔻 少 1 粒';
        playTone('minus');
        render(false);
        speakCantonese(`少一粒，現在是${numberToChinese(getTotal())}`);
        return;
      }

      // 情況 B：目前是整十 (10、20... 100)，進入「退一當十」手動點擊模式
      if (state.ones === 0 && state.tens > 0) {
        state.pendingSplit = true;
        playTone('warn');
        render(false);
        speakCantonese('不夠粒減！點我把一條拆成十粒並減一粒！');
      }
    }

    // 3. 執行「滿 10 粒合成 1 條」或「把 1 條拆成 10 粒並減 1 粒」
    function executeSpecialAction() {
      // 滿 10 粒 -> 合成 1 條
      if (state.ones === 10) {
        state.tens += 1;
        state.ones = 0;
        state.lastActionText = '🎉 10粒合成1條！';
        playTone('bundle');
        render(true);
        const cn = numberToChinese(getTotal());
        showToast(`太棒了！10 粒合成 1 條，變成 ${cn}！`);
        speakCantonese(`太棒了！十粒合成一條，現在是${cn}！`);
        return;
      }

      // 整十減 1 -> 把 1 條拆成 10 粒，並拿走 1 粒變成 9 粒
      if (state.pendingSplit && state.tens > 0) {
        state.tens -= 1;
        state.ones = 9;
        state.pendingSplit = false;
        state.lastActionText = '🪄 1條拆開減1粒！';
        playTone('split');
        render(true);
        const cn = numberToChinese(getTotal());
        showToast(`1 條拆成 10 粒並減 1 粒，變成 ${cn}！`);
        speakCantonese(`一條拆成十粒並減一粒，現在是${cn}！`);
      }
    }

    // 點擊散裝「粒」區域也可以直接合併
    function handleOnesClick() {
      if (state.ones === 10) {
        executeSpecialAction();
      }
    }

    // 點擊十位「條」區域（當處於整十退位狀態時可直接拆開）
    function handleRodClick() {
      if (state.pendingSplit) {
        executeSpecialAction();
      }
    }

    // 4. 清空歸零 (重設為 0)
    function handleReset() {
      state.tens = 0;
      state.ones = 0;
      state.pendingSplit = false;
      state.lastActionText = '🔄 清空歸零';
      playTone('minus');
      render(false);
      showToast('已清空歸零，現在是 0 粒');
      speakCantonese('清空歸零，現在是零，讀作零');
    }

    /**
     * ==================== 專屬可愛數字鍵盤邏輯 (限定 0 至 100) ====================
     */
    function openKeypad() {
      state.keypadValue = '';
      document.getElementById('keypad-display').textContent = '_';
      const errEl = document.getElementById('keypad-error');
      errEl.textContent = '請輸入 0 至 100 之間的整數';
      errEl.classList.remove('text-rose-600');
      errEl.classList.add('text-slate-500');
      document.getElementById('keypad-modal').classList.remove('hidden');
      playTone('add');
    }

    function closeKeypad() {
      document.getElementById('keypad-modal').classList.add('hidden');
    }

    function pressKey(digit) {
      const errEl = document.getElementById('keypad-error');
      let next = '';

      // 若目前已經是 '0'，再按其他數字時自動替換為該數字（避免出現 '05'）
      if (state.keypadValue === '0') {
        next = digit;
      } else {
        next = state.keypadValue + digit;
      }

      const numVal = parseInt(next, 10);
      if (numVal > 100) {
        errEl.textContent = '⚠️ 最多只能輸入 100 喔！';
        errEl.classList.remove('text-slate-500');
        errEl.classList.add('text-rose-600');
        playTone('warn');
        return;
      }

      playTone('add');
      state.keypadValue = next;
      document.getElementById('keypad-display').textContent = state.keypadValue;
      errEl.textContent = '請輸入 0 至 100 之間的整數';
      errEl.classList.remove('text-rose-600');
      errEl.classList.add('text-slate-500');
    }

    function clearKeypad() {
      playTone('minus');
      state.keypadValue = '';
      document.getElementById('keypad-display').textContent = '_';
      const errEl = document.getElementById('keypad-error');
      errEl.textContent = '請輸入 0 至 100 之間的整數';
      errEl.classList.remove('text-rose-600');
      errEl.classList.add('text-slate-500');
    }

    function confirmKeypad() {
      if (state.keypadValue === '') {
        const errEl = document.getElementById('keypad-error');
        errEl.textContent = '⚠️ 請先輸入 0 至 100 的數字！';
        errEl.classList.remove('text-slate-500');
        errEl.classList.add('text-rose-600');
        playTone('warn');
        return;
      }

      const target = parseInt(state.keypadValue, 10);
      if (isNaN(target) || target < 0 || target > 100) {
        const errEl = document.getElementById('keypad-error');
        errEl.textContent = '⚠️ 請輸入 0 至 100 之間的整數！';
        errEl.classList.remove('text-slate-500');
        errEl.classList.add('text-rose-600');
        playTone('warn');
        return;
      }

      state.tens = Math.floor(target / 10);
      state.ones = target % 10;
      state.pendingSplit = false;
      state.lastActionText = `🎯 拿出 ${target} 粒`;
      closeKeypad();
      playTone('bundle');
      render(true);
      const cn = numberToChinese(target);
      speakCantonese(`拿出了${cn}，讀作${cn}`);
    }

    /**
     * ==================== 老師小眼睛遮罩功能 ====================
     */
    function toggleMask(type) {
      state.masks[type] = !state.masks[type];
      const isHidden = state.masks[type];

      const iconEl = document.getElementById(`eye-icon-${type}`);
      const btnEl = document.getElementById(`toggle-${type}-btn`);
      iconEl.textContent = isHidden ? '🙈' : '👁️';
      
      if (isHidden) {
        btnEl.classList.add('ring-2', 'ring-purple-500', 'bg-slate-200');
      } else {
        btnEl.classList.remove('ring-2', 'ring-purple-500', 'bg-slate-200');
      }

      applyMasks();
    }

    function applyMasks() {
      const numBadge = document.getElementById('number-badge');
      const readBadge = document.getElementById('reading-badge');
      const hintBubble = document.getElementById('hint-bubble');

      numBadge.classList.toggle('hidden-mask', state.masks.num);
      readBadge.classList.toggle('hidden-mask', state.masks.read);
      hintBubble.classList.toggle('hidden-mask', state.masks.hint);
    }

    /**
     * ==================== 畫面渲染與文字生成 ====================
     */
    function getPlainHintText() {
      const total = getTotal();
      if (state.ones === 10) {
        return `有 ${state.tens} 條和 10 粒，滿 10 粒了，點我合成 1 條！`;
      }
      if (state.pendingSplit) {
        return `有 ${state.tens} 條，不夠粒減，點我把 1 條拆成 10 粒並減 1 粒！`;
      }
      if (total === 0) {
        return '一粒也沒有，即有 0 個 10 和 0 個 1。';
      }
      if (total === 100) {
        return '有 10 條，即有 10 個 10，也就是 1 個 100。';
      }
      if (state.tens > 0 && state.ones > 0) {
        return `有 ${state.tens} 條和 ${state.ones} 粒，即有 ${state.tens} 個 10 和 ${state.ones} 個 1。`;
      }
      if (state.tens > 0 && state.ones === 0) {
        return `有 ${state.tens} 條，即有 ${state.tens} 個 10。`;
      }
      return `有 ${state.ones} 粒，即有 ${state.ones} 個 1。`;
    }

    function getRichHintHTML() {
      const total = getTotal();
      if (state.ones === 10) {
        return `有 <span class="text-emerald-600 text-xl sm:text-2xl font-black">${state.tens}</span> 條和 <span class="text-orange-500 text-xl sm:text-2xl font-black">10</span> 粒，<br>滿 10 粒了！快點合成 <span class="text-emerald-600 font-black">1 條</span> 吧！`;
      }
      if (state.pendingSplit) {
        return `有 <span class="text-emerald-600 text-xl sm:text-2xl font-black">${state.tens}</span> 條，不夠粒減！<br>快點把 <span class="text-rose-500 font-black">1 條</span> 拆成 <span class="text-orange-500 font-black">10 粒</span> 並減 1 粒！`;
      }
      if (total === 0) {
        return `一粒也沒有，<br>即有 <span class="text-emerald-600 text-xl sm:text-2xl font-black">0</span> 個 10 和 <span class="text-orange-500 text-xl sm:text-2xl font-black">0</span> 個 1。`;
      }
      if (total === 100) {
        return `有 <span class="text-emerald-600 text-xl sm:text-2xl font-black">10</span> 條，<br>即有 <span class="text-emerald-600 text-xl sm:text-2xl font-black">10</span> 個 10（也就是 <span class="text-purple-600 font-black">1 個 100</span>）。`;
      }
      if (state.tens > 0 && state.ones > 0) {
        return `有 <span class="text-emerald-600 text-xl sm:text-2xl font-black">${state.tens}</span> 條和 <span class="text-orange-500 text-xl sm:text-2xl font-black">${state.ones}</span> 粒，<br>即有 <span class="text-emerald-600 text-xl sm:text-2xl font-black">${state.tens}</span> 個 10 和 <span class="text-orange-500 text-xl sm:text-2xl font-black">${state.ones}</span> 個 1。`;
      }
      if (state.tens > 0 && state.ones === 0) {
        return `有 <span class="text-emerald-600 text-xl sm:text-2xl font-black">${state.tens}</span> 條，<br>即有 <span class="text-emerald-600 text-xl sm:text-2xl font-black">${state.tens}</span> 個 10。`;
      }
      return `有 <span class="text-orange-500 text-xl sm:text-2xl font-black">${state.ones}</span> 粒，<br>即有 <span class="text-orange-500 text-xl sm:text-2xl font-black">${state.ones}</span> 個 1。`;
    }

    function render(animateNew = false) {
      const total = getTotal();
      const cn = numberToChinese(total);

      // 1. 更新數字與讀作標籤
      document.getElementById('display-number').textContent = total;
      document.getElementById('display-reading').textContent = `${total} 讀作${cn}`;
      document.getElementById('display-hint').innerHTML = getRichHintHTML();

      // 1.5 更新 0 粒空狀態提示顯示與否（維持舞台高度不跳動）
      const zeroPlaceholder = document.getElementById('zero-placeholder');
      zeroPlaceholder.classList.toggle('hidden', total !== 0);

      // 2. 更新動態操作標籤
      const actionBadge = document.getElementById('action-badge');
      if (state.lastActionText) {
        actionBadge.textContent = state.lastActionText;
        actionBadge.classList.remove('hidden');
      } else {
        actionBadge.classList.add('hidden');
      }

      // 3. 繪製「條」（十位）
      const tensContainer = document.getElementById('tens-container');
      tensContainer.innerHTML = '';
      tensContainer.classList.toggle('can-split-highlight', state.pendingSplit);

      for (let t = 0; t < state.tens; t++) {
        const rod = document.createElement('div');
        rod.className = 'ten-rod';
        if (animateNew && t === state.tens - 1 && state.ones === 0) {
          rod.classList.add('animate-pop-in');
        }
        rod.onclick = handleRodClick;
        rod.title = state.pendingSplit ? '點我拆成 10 粒並減 1 粒' : '1 條 = 10 粒';

        for (let i = 0; i < 10; i++) {
          const cube = document.createElement('div');
          cube.className = 'cube';
          rod.appendChild(cube);
        }
        tensContainer.appendChild(rod);
      }

      // 4. 繪製「粒」（個位：每 5 粒一豎排，第 1-5 粒在左排，第 6-10 粒在右排）
      const onesWrapper = document.getElementById('ones-wrapper');
      const col1 = document.getElementById('ones-col-1');
      const col2 = document.getElementById('ones-col-2');
      col1.innerHTML = '';
      col2.innerHTML = '';

      onesWrapper.classList.toggle('can-bundle-highlight', state.ones === 10);

      for (let o = 1; o <= state.ones; o++) {
        const cube = document.createElement('div');
        cube.className = 'cube';
        if (animateNew && o === state.ones) {
          cube.classList.add('animate-pop-in');
        }
        if (o <= 5) {
          col1.appendChild(cube);
        } else {
          col2.appendChild(cube);
        }
      }

      // 5. 更新「滿十合併 / 退一拆開」醒目互動橫幅
      const banner = document.getElementById('special-action-banner');
      const bannerIcon = document.getElementById('special-action-icon');
      const bannerText = document.getElementById('special-action-text');

      if (banner && bannerIcon && bannerText) {
        if (state.ones === 10) {
          banner.classList.remove('hidden');
          bannerIcon.textContent = '✨';
          bannerText.textContent = '滿 10 粒了！點我合成 1 條 ✨';
        } else if (state.pendingSplit) {
          banner.classList.remove('hidden');
          bannerIcon.textContent = '🪄';
          bannerText.textContent = '不夠粒減！點我把 1 條拆成 10 粒並減 1 粒 🪄';
        } else {
          banner.classList.add('hidden');
        }
      }

      // 6. 更新底部按鈕啟用狀態（嚴格限定 0-100，且在等待手動合併/拆開時暫時鎖定加減按鈕）
      const isPendingAction = (state.ones === 10 || state.pendingSplit);
      document.getElementById('btn-minus').disabled = (total <= 0 || isPendingAction);
      document.getElementById('btn-plus').disabled = (total >= 100 || isPendingAction);

      applyMasks();
    }

    function triggerBannerShake() {
      const btn = document.getElementById('special-action-btn');
      btn.classList.remove('animate-shake');
      void btn.offsetWidth;
      btn.classList.add('animate-shake');
    }

    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById('toast-msg');
      el.textContent = msg;
      el.classList.remove('opacity-0');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        el.classList.add('opacity-0');
      }, 2400);
    }

    // 頁面載入後初始化畫面（預設顯示課本第 44 頁的「21」）
    window.addEventListener('DOMContentLoaded', () => {
      render(false);
    });
  </script>
</body>
</html>
