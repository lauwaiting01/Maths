<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2-18數字拆分與合成教學動畫</title>
    <style>
        :root {
            --bg-color: #FFFDF0;
            --primary-color: #FF6B81;
            --secondary-color: #4EA8DE;
            --text-color: #2F3E46;
            --btn-active: #FFD166;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            overflow-x: hidden;
        }

        h1 {
            font-size: 28px;
            margin: 5px 0 15px 0;
            color: #5C677D;
            text-shadow: 2px 2px #FFE5A3;
        }

        /* 頂部選擇區 */
        .selector-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            max-width: 1100px;
            background: #FFFFFF;
            padding: 12px;
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.05);
            border: 3px solid #F0EDCC;
            margin-bottom: 15px;
        }

        .num-btn {
            width: 55px;
            height: 55px;
            font-size: 24px;
            font-weight: bold;
            border: 2px solid #E2E8F0;
            background-color: #F8FAFC;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #475569;
        }

        .num-btn:hover {
            transform: scale(1.08);
            background-color: #EDF2F7;
        }

        .num-btn.active {
            background-color: var(--btn-active);
            border-color: #F4A261;
            color: #000000;
            box-shadow: 0 4px 10px rgba(244,162,97,0.3);
            transform: scale(1.1);
        }

        /* 主要教學版面 */
        .main-workspace {
            display: flex;
            width: 100%;
            max-width: 1200px;
            justify-content: space-between;
            gap: 20px;
            margin-top: 5px;
        }

        /* 左側與中央動畫區 */
        .left-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #FFFFFF;
            padding: 20px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.04);
            border: 3px solid #E2E8F0;
            position: relative;
        }

        .current-number-display {
            font-size: 72px;
            font-weight: 900;
            color: #2B2D42;
            margin-bottom: 20px;
            background: #E8F5E9;
            padding: 5px 40px;
            border-radius: 20px;
            border: 3px dashed #A3E635;
        }

        .circles-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 60px;
            position: relative;
            min-height: 320px;
            width: 100%;
        }

        .container-circle {
            width: 260px;
            height: 260px;
            border-radius: 50%;
            position: relative;
            background-color: #FAFAFA;
            transition: all 0.3s ease;
        }

        .container-circle.left-circle {
            border: 6px dashed var(--primary-color);
            box-shadow: 0 0 15px rgba(255, 107, 129, 0.1);
        }

        .container-circle.right-circle {
            border: 6px dashed var(--secondary-color);
            box-shadow: 0 0 15px rgba(78, 168, 222, 0.1);
        }

        /* 操控按鈕 */
        .control-panel {
            margin-top: 30px;
        }

        .action-btn {
            font-size: 26px;
            font-weight: bold;
            padding: 14px 35px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(76,175,80,0.3);
            transition: all 0.2s ease;
        }

        .action-btn:hover:not(:disabled) {
            background-color: #45a049;
            transform: translateY(-3px);
            box-shadow: 0 8px 18px rgba(76,175,80,0.4);
        }

        .action-btn:active:not(:disabled) {
            transform: translateY(1px);
        }

        .action-btn:disabled {
            background-color: #CBD5E1;
            color: #64748B;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* 右側算式顯示區 */
        .right-content {
            width: 380px;
            background: #FFFFFF;
            padding: 20px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.04);
            border: 3px solid #E2E8F0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .section-title {
            font-size: 22px;
            font-weight: bold;
            color: #64748B;
            margin-bottom: 15px;
            border-bottom: 3px solid #F1F5F9;
            width: 100%;
            text-align: center;
            padding-bottom: 8px;
        }

        .formula-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            max-height: 480px;
            padding-right: 5px;
        }

        .formula-item {
            background: #F8FAFC;
            border-radius: 16px;
            padding: 12px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.4s ease;
            border: 2px solid #E2E8F0;
        }

        .formula-item.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .formula-item.highlight {
            background: #FFF0F2;
            border-color: var(--primary-color);
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(255,107,129,0.15);
            z-index: 2;
        }

        .formula-text {
            font-size: 32px;
            font-weight: 800;
            color: #334155;
        }

        .formula-item.highlight .formula-text {
            color: #D90429;
        }

        .formula-sub-text {
            font-size: 22px;
            font-weight: bold;
            color: #64748B;
        }

        .formula-item.highlight .formula-sub-text {
            color: #E63946;
        }

        /* 糖果設計 (SVG) */
        .candy {
            width: 44px;
            height: 44px;
            position: absolute;
            z-index: 10;
            pointer-events: none;
        }

        .candy-moving {
            transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 100;
        }
    </style>
</head>
<body>

    <h1>🍬 2-18 數字拆分、合成與減法學習樂園 🎒</h1>

    <!-- 頂部數字選擇 -->
    <div class="selector-container" id="selectorContainer"></div>

    <!-- 主要工作區 -->
    <div class="main-workspace">
        
        <!-- 左邊/中央：動畫演示區 -->
        <div class="left-content">
            <div class="current-number-display" id="numberDisplay">【2】</div>
            
            <div class="circles-wrapper" id="circlesWrapper">
                <!-- 左邊紅圈 -->
                <div class="container-circle left-circle" id="leftCircle"></div>
                <!-- 右邊藍圈 -->
                <div class="container-circle right-circle" id="rightCircle"></div>
            </div>

            <!-- 控制按鈕 -->
            <div class="control-panel">
                <button class="action-btn" id="actionBtn" onclick="moveCandy()">分一顆糖果 ➡️</button>
            </div>
        </div>

        <!-- 右邊：數式紀錄區 -->
        <div class="right-content">
            <div class="section-title">📊 數學魔法算式</div>
            <div class="formula-list" id="formulaList"></div>
        </div>
    </div>

    <!-- 糖果 SVG 模板定義 -->
    <svg id="candyTemplate" style="display: none;">
        <g>
            <!-- 左蝴蝶結翅膀 -->
            <path d="M12 22 L2 14 L2 30 Z" fill="#FFD166" stroke="#F4A261" stroke-width="1.5" stroke-linejoin="round"/>
            <!-- 右蝴蝶結翅膀 -->
            <path d="M32 22 L42 14 L42 30 Z" fill="#FFD166" stroke="#F4A261" stroke-width="1.5" stroke-linejoin="round"/>
            <!-- 糖果本體主圓形 -->
            <circle cx="22" cy="22" r="11" fill="#FF6B81" stroke="#D90429" stroke-width="2"/>
            <!-- 糖果包裝紙褶皺紋路 -->
            <path d="M6 18 L12 22 L6 26" fill="none" stroke="#F4A261" stroke-width="1.5"/>
            <path d="M38 18 L32 22 L38 26" fill="none" stroke="#F4A261" stroke-width="1.5"/>
            <!-- 糖果中央高光斑點 -->
            <circle cx="18" cy="18" r="3" fill="#FFFFFF" opacity="0.6"/>
        </g>
    </svg>

    <script>
        let currentTotal = 2;
        let rightCount = 0; 
        let isAnimating = false;
        let originalPositions = [];

        // 初始化數字選擇按鈕 (2-18)
        const selectorContainer = document.getElementById('selectorContainer');
        for (let i = 2; i <= 18; i++) {
            const btn = document.createElement('button');
            btn.className = `num-btn ${i === 2 ? 'active' : ''}`;
            btn.innerText = i;
            btn.onclick = () => selectNumber(i);
            selectorContainer.appendChild(btn);
        }

        // 選擇新的主數字
        function selectNumber(num) {
            if (isAnimating) return;
            currentTotal = num;
            rightCount = 0;
            
            // 更新按鈕高亮
            document.querySelectorAll('.num-btn').forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.innerText) === num);
            });

            // 更新中央上方大字
            document.getElementById('numberDisplay').innerText = `【${num}】`;
            
            // 重置按鈕狀態
            const actionBtn = document.getElementById('actionBtn');
            actionBtn.disabled = false;
            actionBtn.innerText = "分一顆糖果 ➡️";
            actionBtn.style.backgroundColor = "#4CAF50";

            // 清空舊糖果與算式
            document.getElementById('formulaList').innerHTML = '';
            clearCandies();

            // 生成並擺放全新糖果至左側紅圈內
            generateLeftCandies(num);
        }

        // 清除畫面上的所有糖果元素
        function clearCandies() {
            document.querySelectorAll('.candy').forEach(c => c.remove());
            originalPositions = [];
        }

        // 在左側圓圈內用數學均勻算法計算位置，保證糖果大小形狀完全一致
        function generateLeftCandies(count) {
            const leftCircle = document.getElementById('leftCircle');
            const rect = leftCircle.getBoundingClientRect();
            const containerX = leftCircle.offsetLeft;
            const containerY = leftCircle.offsetTop;
            const radius = 90; // 分佈半徑，留出邊界防止超出
            const centerX = containerX + 130 - 22; // 圈中央減去糖果半徑
            const centerY = containerY + 130 - 22;

            for (let i = 0; i < count; i++) {
                let angle, r, x, y;
                if (count === 1) {
                    x = centerX;
                    y = centerY;
                } else {
                    // 完美的向日葵菲波那契螺旋均勻分佈算法，保證糖果不重疊且整齊
                    const phi = (Math.sqrt(5) + 1) / 2;
                    const goldenAngle = phi * 2 * Math.PI;
                    r = radius * Math.sqrt((i + 0.5) / count);
                    angle = i * goldenAngle;
                    x = centerX + r * Math.cos(angle);
                    y = centerY + r * Math.sin(angle);
                }

                // 複製 SVG 糖果模板
                const candyTemplate = document.getElementById('candyTemplate');
                const newCandy = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                newCandy.setAttribute("class", "candy");
                newCandy.setAttribute("viewBox", "0 0 44 44");
                newCandy.innerHTML = candyTemplate.innerHTML;
                
                // 定位
                newCandy.style.left = `${x}px`;
                newCandy.style.top = `${y}px`;
                
                document.getElementById('circlesWrapper').appendChild(newCandy);
                originalPositions.push({ element: newCandy, startX: x, startY: y });
            }
        }

        // 分發糖果與生成連動算式
        function moveCandy() {
            if (isAnimating) return;
            
            const leftCount = currentTotal - rightCount;
            // 限制：左邊至少剩下 1 顆，即最多分到 left=1, right=total-1
            if (leftCount <= 1) return;

            isAnimating = true;
            const actionBtn = document.getElementById('actionBtn');
            actionBtn.disabled = true;

            // 挑選陣列中最後加入的那顆糖果進行搬運
            const candyObj = originalPositions[originalPositions.length - 1 - rightCount];
            const candyEl = candyObj.element;

            // 計算右側藍圈的落點中心位置
            const rightCircle = document.getElementById('rightCircle');
            const rContainerX = rightCircle.offsetLeft;
            const rContainerY = rightCircle.offsetTop;
            const rRadius = 90;
            const rCenterX = rContainerX + 130 - 22;
            const rCenterY = rContainerY + 130 - 22;

            // 計算在右圈內的新擺放坐標 (使用均勻分布)
            let nextRightIndex = rightCount;
            let targetX, targetY;
            const totalRightTarget = currentTotal - 1; // 最大可能搬移的總數

            if (totalRightTarget <= 1) {
                targetX = rCenterX;
                targetY = rCenterY;
            } else {
                const phi = (Math.sqrt(5) + 1) / 2;
                const goldenAngle = phi * 2 * Math.PI;
                let r = rRadius * Math.sqrt((nextRightIndex + 0.5) / totalRightTarget);
                let angle = nextRightIndex * goldenAngle;
                targetX = rCenterX + r * Math.cos(angle);
                targetY = rCenterY + r * Math.sin(angle);
            }

            // 套用 1.2 秒的慢速流暢動畫
            candyEl.classList.add('candy-moving');
            
            // 計算位移差並加上精緻的半空旋轉微放大特效
            const deltaX = targetX - candyObj.startX;
            const deltaY = targetY - candyObj.startY;
            candyEl.style.transform = `translate(${deltaX}px, ${deltaY}px) scale(1.15) rotate(15deg)`;

            // 增加目前右側糖果計數
            rightCount++;

            // 動態產生加法與全新的減法算式組合
            setTimeout(() => {
                candyEl.style.transform = `translate(${deltaX}px, ${deltaY}px) scale(1) rotate(0deg)`; // 降落平穩狀態
                
                const curLeft = currentTotal - rightCount;
                const curRight = rightCount;

                // 移除之前其他算式的高亮
                document.querySelectorAll('.formula-item').forEach(item => item.classList.remove('highlight'));

                // 建立新的算式卡片
                const formulaList = document.getElementById('formulaList');
                const item = document.createElement('div');
                item.className = 'formula-item highlight';

                // 上排：加法合成/拆分 (例如 4 = 3 + 1)
                const addDiv = document.createElement('div');
                addDiv.className = 'formula-text';
                addDiv.innerText = `${currentTotal} = ${curLeft} + ${curRight}`;

                // 下排：新加入的對應減法算式 (例如 4 - 1 = 3)
                const subDiv = document.createElement('div');
                subDiv.className = 'formula-sub-text';
                subDiv.innerText = `（ ${currentTotal} - ${curRight} = ${curLeft} ）`;

                item.appendChild(addDiv);
                item.appendChild(subDiv);
                formulaList.appendChild(item);

                // 觸發淡入滑動動態
                setTimeout(() => {
                    item.classList.add('visible');
                    formulaList.scrollTop = formulaList.scrollHeight; // 自動滾動到底部
                }, 50);

                // 檢查是否全部分配完畢
                if (curLeft === 1) {
                    actionBtn.innerText = "全部教授完畢 ✨";
                    actionBtn.style.backgroundColor = "#94A3B8";
                    actionBtn.disabled = true;
                } else {
                    actionBtn.disabled = false;
                }
                
                isAnimating = false;
            }, 1200); // 精準對齊 1.2 秒慢速移動
        }

        // 網頁首次載入初始化
        window.onload = () => {
            selectNumber(2);
        };
    </script>
</body>
</html>
