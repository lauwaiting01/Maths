<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小一數學：第幾行第幾個</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+HK:wght@400;700&display=swap');
        
        body {
            font-family: 'Noto Sans HK', sans-serif;
            background-color: #FFF9E6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #4A4A4A;
            user-select: none;
        }

        h1 {
            font-family: 'ZCOOL+KuaiLe', 'ZCOOL KuaiLe', sans-serif;
            color: #FF6B6B;
            font-size: 32px;
            text-shadow: 2px 2px #FFF;
            margin-bottom: 10px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: white;
            border-radius: 30px;
            padding: 25px;
            box-shadow: 0 10px 0px #E6D2A0, 0 15px 30px rgba(0,0,0,0.1);
            border: 4px solid #FFD166;
            position: relative;
            min-height: 520px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Top Progress & Navigation */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .stage-title {
            font-size: 20px;
            font-weight: bold;
            color: #118AB2;
            background: #E8F5E9;
            padding: 6px 16px;
            border-radius: 20px;
            border: 2px dashed #118AB2;
        }

        .nav-btn {
            background-color: #06D6A0;
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 5px 0 #05B386;
            transition: all 0.1s;
        }
        .nav-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #05B386;
        }

        /* Learning Area & Grid */
        .content-area {
            flex-grow: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
        }

        .grid-container {
            display: flex;
            flex-direction: column-reverse; /* Row 1 at bottom, Row 2 above it */
            gap: 25px;
            padding: 20px;
            position: relative;
            background: #FFFDF6;
            border-radius: 20px;
            border: 3px solid #FFEBB7;
        }

        .grid-row {
            display: flex;
            gap: 25px;
            position: relative;
        }

        .grid-item {
            width: 70px;
            height: 70px;
            background: #F4F1DE;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 0 6px 0 #E0DBC5;
            position: relative;
            transition: transform 0.2s;
            cursor: pointer;
        }
        .grid-item.highlighted {
            background: #FFD166;
            box-shadow: 0 6px 0 #E6B53C;
            transform: scale(1.05);
        }

        /* Pointers/Arrows */
        .pointer {
            position: absolute;
            background: #FF6B6B;
            color: white;
            padding: 6px 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            white-space: nowrap;
            z-index: 10;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pointer::after {
            content: '';
            position: absolute;
            border: 8px solid transparent;
        }

        /* Bottom pointing pointer */
        .pointer.bottom-up {
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
        }
        .pointer.bottom-up::after {
            border-top-color: #FF6B6B;
            top: -15px; /* flipped logic for "pointing to item from below" */
            bottom: auto;
        }
        /* Custom adjustment for pointing from bottom */
        .pointer.point-up {
            bottom: -45px;
        }
        .pointer.point-up::after {
            border-bottom-color: #FF6B6B;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Left pointing to right pointer */
        .pointer.left-to-right {
            left: -95px;
            top: 50%;
            transform: translateY(-50%);
            background: #118AB2;
        }
        .pointer.left-to-right::after {
            border-left-color: #118AB2;
            right: -15px;
            top: 50%;
            transform: translateY(-50%);
        }

        /* Text instruction style */
        .instruction-text {
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
            min-height: 40px;
            color: #333;
        }
        .highlight-1 { color: #FF6B6B; font-size: 26px; }
        .highlight-2 { color: #118AB2; font-size: 26px; }

        /* Game Layout Styles */
        .game-layout {
            display: flex;
            width: 100%;
            justify-content: space-between;
            gap: 20px;
        }

        .game-left {
            width: 40%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #F0F9FF;
            padding: 20px;
            border-radius: 20px;
            border: 3px dashed #74C0FC;
        }

        .game-right {
            width: 55%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-question-box {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            color: #2B2D42;
        }

        /* Drag and Drop Zone styles */
        .drop-slots {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 24px;
            font-weight: bold;
            margin-top: 15px;
        }
        .drop-target {
            width: 50px;
            height: 45px;
            background: #FFF;
            border: 3px dashed #4A4A4A;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #FF6B6B;
            font-size: 24px;
        }
        .drop-target.correct {
            border-color: #06D6A0;
            background: #E8F5E9;
        }

        .options-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
        }
        .drag-option {
            padding: 8px 16px;
            background: #FFD166;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            cursor: grab;
            box-shadow: 0 4px 0 #E6B53C;
        }
        .drag-option:active {
            cursor: grabbing;
        }

        /* Game Hint Pointers */
        .hint-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            top: 0;
            left: 0;
        }

        /* Feedbacks */
        .feedback {
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            margin-top: 10px;
            height: 30px;
        }
        .feedback.success { color: #06D6A0; }
        .feedback.fail { color: #FF6B6B; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <h1>可愛排排隊：第幾行、第幾個 🐾</h1>

    <div class="container">
        <!-- Top bar -->
        <div class="header-bar">
            <div class="stage-title" id="stageTitle">第一步：認識排隊</div>
            <button class="nav-btn" id="nextBtn" onclick="nextStep()">下一頁 ✨</button>
        </div>

        <!-- Central Instruction -->
        <div class="instruction-text" id="instruction">
            看！有一行小動物在排隊哦。
        </div>

        <!-- Main Display Content Area -->
        <div class="content-area">
            
            <!-- Standard Interactive Grid (Used in Teaching & Game Hinting) -->
            <div class="grid-container" id="mainGrid">
                <!-- Rows will be dynamically loaded/modified here -->
            </div>

            <!-- Game Wrapper (Side-by-side Layout) -->
            <div class="game-layout hidden" id="gameLayout">
                <!-- Left panel for questions / drag slots -->
                <div class="game-left" id="gameLeftPanel">
                    <!-- Dynamic Question Area -->
                </div>
                <!-- Right panel for the grid interactive area -->
                <div class="game-right" id="gameRightPanel">
                    <!-- The Grid container will be attached here dynamically during game mode -->
                </div>
            </div>

        </div>

        <!-- Feedback Area -->
        <div class="feedback" id="feedbackMsg"></div>
    </div>

    <script>
        // Animals array
        const animals = ['🐱', '🐶', '🦁', '🐰', '🦊', '🐻', '🐼', '🐸', '🐨', '🐯', '🐵', '🐷'];
        
        // App State
        let currentStep = 1;
        let gameScore = 0;
        let gameType = 1; // 1: Pick item by text, 2: Drag answers for target animal
        let currentTargetItem = { row: 1, col: 1 };
        let draggedValue = null;
        let selectedRowAns = null;
        let selectedColAns = null;

        // Grid definition data helper
        // We will maintain a fixed 3x4 layout for diversity in Step 3 & games
        // Row 1 (Bottom), Row 2 (Middle), Row 3 (Top)
        const gridData = [
            ['🐱', '🐶', '🦁', '🐰'], // Row 1 (Bottom index 0 internally)
            ['🦊', '🐻', '🐼', '🐸'], // Row 2 (Middle index 1 internally)
            ['🐨', '🐯', '🐵', '🐷']  // Row 3 (Top index 2 internally)
        ];

        const numToChinese = { 1: '一', 2: '二', 3: '三', 4: '四' };

        function initApp() {
            renderStep();
        }

        function renderGrid(rowsToShow = 1, showPointers = false, highlightItem = null) {
            const gridContainer = document.getElementById('mainGrid');
            gridContainer.innerHTML = '';

            for (let r = 0; r < rowsToShow; r++) {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'grid-row';
                rowDiv.id = `row-${r+1}`;

                // Row Pointer (Left Side pointing to right)
                if (showPointers) {
                    const rowPointer = document.createElement('div');
                    rowPointer.className = 'pointer left-to-right';
                    rowPointer.innerText = `第${numToChinese[r+1]}行`;
                    rowDiv.appendChild(rowPointer);
                }

                for (let c = 0; c < 4; c++) {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'grid-item';
                    itemDiv.innerText = gridData[r][c];
                    itemDiv.dataset.row = r + 1;
                    itemDiv.dataset.col = c + 1;

                    // Add click action for Game Type 1
                    itemDiv.onclick = function() { handleItemClick(r+1, c+1); };

                    // Highlight specific item if requested
                    if (highlightItem && highlightItem.row === (r+1) && highlightItem.col === (c+1)) {
                        itemDiv.classList.add('highlighted');
                    }

                    // Column Pointer for the target column / first item
                    if (r === 0 && showPointers && c === 0) {
                        const colPointer = document.createElement('div');
                        colPointer.className = 'pointer point-up';
                        colPointer.innerText = `第一個`;
                        itemDiv.appendChild(colPointer);
                    } else if (currentStep === 1 && r === 0 && c === 0) {
                        // Step 1 specific pointer
                        const colPointer = document.createElement('div');
                        colPointer.className = 'pointer point-up';
                        colPointer.innerText = `第一個`;
                        itemDiv.appendChild(colPointer);
                    }

                    rowDiv.appendChild(itemDiv);
                }
                gridContainer.appendChild(rowDiv);
            }
        }

        function renderStep() {
            // Clean up layouts
            document.getElementById('gameLayout').classList.add('hidden');
            const mainGrid = document.getElementById('mainGrid');
            mainGrid.classList.remove('hidden');
            document.querySelector('.content-area').appendChild(mainGrid);
            document.getElementById('feedbackMsg').innerText = '';
            document.getElementById('nextBtn').innerText = "下一頁 ✨";

            if (currentStep === 1) {
                document.getElementById('stageTitle').innerText = "第一步：認識第一個";
                document.getElementById('instruction').innerHTML = "首先，這裏只有一行小動物。看箭頭，這是從左手邊數起的<span class='highlight-1'>第一個</span>！";
                renderGrid(1, false);
            } 
            else if (currentStep === 2) {
                document.getElementById('stageTitle').innerText = "第二步：認識第一行與第二行";
                document.getElementById('instruction').innerHTML = "點擊後，第一行的後方（上方）出現了新的一行！下方是<span class='highlight-1'>第「一」行</span>，上方是<span class='highlight-2'>第「二」行</span>哦！";
                renderGrid(2, true);
            } 
            else if (currentStep === 3) {
                document.getElementById('stageTitle').innerText = "第三步：如果有更多行呢？";
                document.getElementById('instruction').innerHTML = "哇！後面多了更多行小動物！試想想，最上面的那一行應該叫第幾行呢？";
                renderGrid(3, false); // Let them notice without full text first
                
                // Add labels dynamically with delay or just show them
                setTimeout(() => {
                    renderGrid(3, true);
                }, 500);
            } 
            else if (currentStep === 4) {
                document.getElementById('stageTitle').innerText = "第四步：學會「第幾行第幾個」";
                document.getElementById('instruction').innerHTML = "結合起來！左邊看<span class='highlight-2'>「第幾行」</span>，下面看<span class='highlight-1'>「第幾個」</span>。全部用中國數字哦！";
                renderGrid(3, true);
                document.getElementById('nextBtn').innerText = "進入遊戲吧 🎮";
            } 
            else if (currentStep === 5) {
                setupGame();
            }
        }

        function nextStep() {
            if (currentStep < 5) {
                currentStep++;
                renderStep();
            } else {
                // Next question in game
                setupGame();
            }
        }

        // --- GAME ENGINE ---
        function setupGame() {
            document.getElementById('stageTitle').innerText = "小試牛刀：歡樂遊戲時間";
            document.getElementById('feedbackMsg').innerText = '';
            
            // Randomly choose game type 1 or 2
            gameType = Math.random() > 0.5 ? 1 : 2;
            
            // Randomly pick a target position
            const targetRow = Math.floor(Math.random() * 3) + 1; // 1 to 3
            const targetCol = Math.floor(Math.random() * 4) + 1; // 1 to 4
            currentTargetItem = { row: targetRow, col: targetCol };

            // Restructure UI layout for Game Mode (Side-by-side)
            const gameLayout = document.getElementById('gameLayout');
            const mainGrid = document.getElementById('mainGrid');
            const gameLeftPanel = document.getElementById('gameLeftPanel');
            const gameRightPanel = document.getElementById('gameRightPanel');

            gameLayout.classList.remove('hidden');
            mainGrid.classList.remove('hidden');
            gameRightPanel.appendChild(mainGrid); // Move grid to right side

            // Render current 3x4 grid for game
            // During games, the bottom-left animal (Row 1, Col 1) has constant hint pointers!
            renderGridWithBottomLeftHint();

            if (gameType === 1) {
                // Type 1: Given text challenge, click target animal on right
                document.getElementById('instruction').innerHTML = "請在右邊找到正確的小動物並點擊牠！";
                gameLeftPanel.innerHTML = `
                    <div class="game-question-box">
                        🎯 請找出：<br><br>
                        <span class="highlight-1" style="font-size:32px;">第${numToChinese[targetRow]}行，第${numToChinese[targetCol]}個</span>
                    </div>
                `;
            } else {
                // Type 2: Drag and drop Chinese number to slots
                document.getElementById('instruction').innerHTML = "把正確的【中國數字】拖到空格裡吧！";
                const targetAnimal = gridData[targetRow-1][targetCol-1];
                selectedRowAns = null;
                selectedColAns = null;

                gameLeftPanel.innerHTML = `
                    <div class="game-question-box">
                        🎯 題目：<br>
                        <span style="font-size: 50px;">${targetAnimal}</span> 在<br>
                        <div class="drop-slots">
                            第 <div class="drop-target" id="rowDrop" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'row')">?</div> 行
                            第 <div class="drop-target" id="colDrop" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'col')">?</div> 個
                        </div>
                    </div>
                    <div class="options-container">
                        <!-- Mix of correct Chinese and wrong Arabic digits -->
                        <div class="drag-option" draggable="true" ondragstart="handleDragStart('一')">一</div>
                        <div class="drag-option" draggable="true" ondragstart="handleDragStart('二')">二</div>
                        <div class="drag-option" draggable="true" ondragstart="handleDragStart('三')">三</div>
                        <div class="drag-option" draggable="true" ondragstart="handleDragStart('四')">四</div>
                        <div class="drag-option" draggable="true" ondragstart="handleDragStart('1')" style="background:#FF9F1C;">1</div>
                        <div class="drag-option" draggable="true" ondragstart="handleDragStart('2')" style="background:#FF9F1C;">2</div>
                        <div class="drag-option" draggable="true" ondragstart="handleDragStart('3')" style="background:#FF9F1C;">3</div>
                    </div>
                    <button class="nav-btn" style="margin-top:20px; background:#118AB2; box-shadow:0 5px 0 #0B6A8A;" onclick="checkDragAnswer()">檢查答案 ✔️</button>
                `;
            }

            document.getElementById('nextBtn').innerText = "下一題 ➡️";
        }

        function renderGridWithBottomLeftHint() {
            const gridContainer = document.getElementById('mainGrid');
            gridContainer.innerHTML = '';

            for (let r = 0; r < 3; r++) {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'grid-row';
                rowDiv.id = `row-${r+1}`;

                // Continuous hint: Row 1 indicator always points to Row 1
                if (r === 0) {
                    const rowPointer = document.createElement('div');
                    rowPointer.className = 'pointer left-to-right';
                    rowPointer.innerText = `第一行`;
                    rowDiv.appendChild(rowPointer);
                }

                for (let c = 0; c < 4; c++) {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'grid-item';
                    itemDiv.innerText = gridData[r][c];
                    itemDiv.dataset.row = r + 1;
                    itemDiv.dataset.col = c + 1;
                    
                    itemDiv.onclick = function() { handleItemClick(r+1, c+1); };

                    // Continuous hint: Column 1 indicator always points to first item
                    if (r === 0 && c === 0) {
                        const colPointer = document.createElement('div');
                        colPointer.className = 'pointer point-up';
                        colPointer.innerText = `第一個`;
                        itemDiv.appendChild(colPointer);
                    }

                    rowDiv.appendChild(itemDiv);
                }
                gridContainer.appendChild(rowDiv);
            }
        }

        // Handle item clicking for Game Type 1
        function handleItemClick(clickedRow, clickedCol) {
            if (currentStep < 5 || gameType !== 1) return;

            const feedback = document.getElementById('feedbackMsg');
            
            // Remove previous highlights
            document.querySelectorAll('.grid-item').forEach(el => el.classList.remove('highlighted'));

            // Highlight clicked item
            const clickedEl = document.querySelector(`[data-row="${clickedRow}"][data-col="${clickedCol}"]`);
            if (clickedEl) clickedEl.classList.add('highlighted');

            if (clickedRow === currentTargetItem.row && clickedCol === currentTargetItem.col) {
                feedback.className = "feedback success";
                feedback.innerText = "🎉 太棒了！答對了！你真聰明！";
            } else {
                feedback.className = "feedback fail";
                feedback.innerText = `❌ 不太對哦，再數一數看！那是第${numToChinese[clickedRow]}行第${numToChinese[clickedCol]}個。`;
            }
        }

        // Drag and Drop implementation details
        function handleDragStart(val) {
            draggedValue = val;
        }

        function allowDrop(ev) {
            ev.preventDefault();
        }

        function handleDrop(ev, type) {
            ev.preventDefault();
            const targetBox = ev.target;
            targetBox.innerText = draggedValue;
            
            if (type === 'row') {
                selectedRowAns = draggedValue;
            } else {
                selectedColAns = draggedValue;
            }
        }

        function checkDragAnswer() {
            const feedback = document.getElementById('feedbackMsg');
            const expectedRowStr = numToChinese[currentTargetItem.row];
            const expectedColStr = numToChinese[currentTargetItem.col];

            if (!selectedRowAns || !selectedColAns) {
                feedback.className = "feedback fail";
                feedback.innerText = "💡 請把兩個空格都填滿哦！";
                return;
            }

            if (selectedRowAns === expectedRowStr && selectedColAns === expectedColStr) {
                feedback.className = "feedback success";
                feedback.innerText = "🎉 太厲害了！完全正確！👏";
                document.getElementById('rowDrop').classList.add('correct');
                document.getElementById('colDrop').classList.add('correct');
            } else if (selectedRowAns == currentTargetItem.row || selectedColAns == currentTargetItem.col) {
                feedback.className = "feedback fail";
                feedback.innerText = "⚠️ 哎呀！記得要用【中國數字】（一二三），不能用阿拉伯數字哦！";
            } else {
                feedback.className = "feedback fail";
                feedback.innerText = "❌ 答錯了，再仔細看看行和個數對不對？";
            }
        }

        // Run setup on load
        window.onload = initApp;
    </script>
</body>
</html>
